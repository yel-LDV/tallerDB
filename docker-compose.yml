version: '3.8'

services:
  # Base de datos MariaDB
  # Los scripts SQL de database/init/ se ejecutan automáticamente la primera
  # vez que se levanta el volumen de datos (esquema + datos de ejemplo).
  db:
    image: mariadb:11
    container_name: tallerdb-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tallerdb}
      MARIADB_USER: ${MARIADB_USER:-taller}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tallerpass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Aplicación FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tallerdb-app
    restart: unless-stopped
    environment:
      DATABASE_TYPE: mariadb
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_USER: ${MARIADB_USER:-taller}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tallerpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tallerdb}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      APP_NAME: ${APP_NAME:-TallerDB}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic:/app/alembic:ro
      - ./scripts:/app/scripts:ro
    # El esquema y los datos iniciales los crea MariaDB con database/init/.
    # Solo se crea el usuario administrador y se levanta la app.
    command: >
      sh -c "
        python scripts/create_admin.py &&
        python run.py
      "

volumes:
  mariadb_data:
