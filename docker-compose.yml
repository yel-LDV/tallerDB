services:
  # Base de datos MariaDB (motor por defecto).
  # Los scripts SQL de database/init/ se ejecutan automáticamente la primera
  # vez que se levanta el volumen de datos (esquema + datos de ejemplo).
  db:
    image: mariadb:11
    container_name: tallerdb-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tallerdb}
      MARIADB_USER: ${MARIADB_USER:-taller}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tallerpass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Aplicación FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tallerdb-app
    restart: unless-stopped
    environment:
      DATABASE_TYPE: mariadb
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_USER: ${MARIADB_USER:-taller}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tallerpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tallerdb}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      APP_NAME: ${APP_NAME:-TallerDB}
      DEBUG: ${DEBUG:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,*.tallerdb.local}"
      UPLOADS_DIR: /app/uploads
      MAX_3D_SIZE_MB: ${MAX_3D_SIZE_MB:-25}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tallerdb.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # El esquema y los datos iniciales los crea MariaDB con database/init/.
    # Solo se crea el usuario administrador y se levanta la app.
    command: >
      sh -c "
        python scripts/create_admin.py &&
        exec python run.py
      "

volumes:
  mariadb_data:
  uploads_data:
