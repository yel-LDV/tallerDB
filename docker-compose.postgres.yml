services:
  # Variante PostgreSQL: docker compose -f docker-compose.postgres.yml up --build
  db:
    image: postgres:16-alpine
    container_name: tallerdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-tallerdb}
      POSTGRES_USER: ${POSTGRES_USER:-taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tallerpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tallerdb-app-postgres
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tallerpass}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-tallerdb}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      APP_NAME: ${APP_NAME:-TallerDB}
      DEBUG: ${DEBUG:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,*.tallerdb.local}"
      UPLOADS_DIR: /app/uploads
      MAX_3D_SIZE_MB: ${MAX_3D_SIZE_MB:-25}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tallerdb.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: >
      sh -c "
        python scripts/create_admin.py &&
        exec python run.py
      "

volumes:
  postgres_data:
  uploads_data:
