services:
  # Desarrollo con hot-reload y SQLite local
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tallerdb-dev
    environment:
      DATABASE_TYPE: sqlite
      SQLITE_PATH: /app/data/dev.db
      DATABASE_CONNECT_TIMEOUT: 5
      SECRET_KEY: dev-secret-key-change-in-production-min-32-characters-long
      SESSION_COOKIE_NAME: session
      SESSION_MAX_AGE_DAYS: 7
      APP_NAME: TallerDB
      DEBUG: "true"
      FORCE_HTTPS: "false"
      UPLOADS_DIR: /app/uploads
      MAX_3D_SIZE_MB: 25
      ADMIN_EMAIL: admin@tallerdb.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
      - /app/.pytest_cache
      - dev_data:/app/data
      - uploads_data:/app/uploads
    command: >
      sh -c "
        python scripts/create_admin.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    stdin_open: true
    tty: true

volumes:
  dev_data:
  uploads_data:
